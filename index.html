<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1b1238" />
<title>Topple Party</title>
<link rel="icon" href="/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #fff; --panel: #1b1238d9; --panel2: #2a1c5acc; --gold: #ffd23f; --muted: #cfc6f5; }
  html { font-size: calc(100vw / 120); }
  @media (min-aspect-ratio: 16/9) { html { font-size: calc(100vh * 16 / 9 / 120); } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc3ff; color: var(--ink);
    font-family: 'Fredoka', system-ui, 'Segoe UI', Roboto, sans-serif; user-select: none; cursor: default; }
  #gl { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100vw; height: 100vh; display: block; }
  #ui { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
  .hidden { display: none !important; }
  .panel { background: var(--panel); border: 0.18rem solid #ffffff22; border-radius: 1.6rem; box-shadow: 0 0.6rem 2rem #0005; backdrop-filter: blur(6px); }
  .outline { text-shadow: 0 0.2rem 0 #1b1238, 0.15rem 0 0 #1b1238, -0.15rem 0 0 #1b1238, 0 -0.15rem 0 #1b1238, 0 0.5rem 1rem #0006; }

  /* ---------------- lobby ---------------- */
  #lobby { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .logo { position: absolute; left: 3rem; top: 1.8rem; font-weight: 700; font-size: 5.4rem; line-height: .86; transform: rotate(-4deg); transform-origin: left top;
    color: #fff; text-shadow: 0 0.35rem 0 #1b1238, 0.25rem 0 0 #1b1238, -0.25rem 0 0 #1b1238, 0 -0.25rem 0 #1b1238, 0 0.8rem 1.6rem #0006; letter-spacing: .1rem; }
  .logo span { display: block; color: var(--gold); margin-left: .6rem; }
  .joinCard { position: absolute; left: 3rem; top: 13.5rem; width: 26rem; padding: 1.4rem; display: flex; flex-direction: column; align-items: center; gap: .9rem; }
  #qr { background: #fff; border-radius: 1.2rem; padding: .6rem; line-height: 0; box-shadow: 0 0 0 .4rem var(--gold); }
  #qr canvas { width: 19rem; height: 19rem; image-rendering: pixelated; }
  .scan { font-size: 2.1rem; font-weight: 700; }
  .joinText { text-align: center; color: var(--muted); font-size: 1.15rem; line-height: 1.35; }
  #joinUrl { color: #fff; font-weight: 600; font-size: 1.2rem; word-break: break-all; }
  #roomCode { font-size: 3.6rem; font-weight: 700; letter-spacing: .6rem; color: var(--gold); line-height: 1.1; margin-top: .2rem; padding-left: .6rem; }
  #netStatus { position: absolute; left: 3rem; bottom: 1.6rem; padding: .5rem 1.1rem; border-radius: 999px; font-size: 1.05rem; background: #0006; }
  #netStatus::before { content: ''; display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .55rem; background: #999; vertical-align: .05rem; }
  #netStatus[data-kind=ok]::before { background: #4ee37a; box-shadow: 0 0 .6rem #4ee37a; }
  #netStatus[data-kind=warn]::before, #netStatus[data-kind=busy]::before { background: #ffd23f; }
  #netStatus[data-kind=err]::before { background: #ff5a6e; }
  .modePanel { position: absolute; right: 3rem; top: 2.4rem; width: 31rem; padding: 1.4rem; display: flex; flex-direction: column; gap: .9rem; }
  .panelTitle { font-size: 1.3rem; color: var(--muted); font-weight: 600; letter-spacing: .08rem; text-transform: uppercase; margin-left: .3rem; }
  #modes { display: flex; flex-direction: column; gap: .7rem; }
  .modeCard { position: relative; padding: .9rem 1.2rem; border-radius: 1.1rem; background: #ffffff12; border: .22rem solid transparent; transition: transform .15s, background .15s; }
  .modeCard .mName { font-size: 1.75rem; font-weight: 700; }
  .modeCard .mTag { color: var(--muted); font-size: 1.05rem; margin-top: .15rem; line-height: 1.25; padding-right: 7rem; }
  .modeCard .mBadge { position: absolute; right: 1rem; top: 1rem; font-size: .9rem; padding: .2rem .7rem; border-radius: 999px; background: #ffffff1f; font-weight: 600; }
  .modeCard.sel { background: #ffd23f26; border-color: var(--gold); }
  .focus { outline: .3rem solid #7fd6ff; outline-offset: .2rem; transform: scale(1.02); }
  #roundsRow { display: flex; align-items: center; justify-content: center; gap: .8rem; font-size: 1.5rem; padding: .6rem; border-radius: 1rem; background: #ffffff12; }
  #roundsRow b { font-size: 2rem; color: var(--gold); }
  #roundsRow .arrow { opacity: .6; font-size: 1.2rem; }
  #startBtn { text-align: center; font-size: 2.3rem; font-weight: 700; padding: .8rem; border-radius: 999px; background: #33c46a; box-shadow: 0 .45rem 0 #1f8546; }
  #startBtn.disabled { background: #6b6680; box-shadow: 0 .45rem 0 #45405a; }
  #hostHint { text-align: center; color: var(--muted); font-size: 1.05rem; line-height: 1.3; }

  /* ---------------- player chips ---------------- */
  #players { position: absolute; left: 50%; bottom: 1.4rem; transform: translateX(-50%); display: flex; gap: .8rem; }
  body.in-lobby #players { left: calc(50% + 0rem); }
  .chip { position: relative; display: flex; align-items: center; gap: .6rem; padding: .45rem 1.1rem .45rem .45rem; border-radius: 999px; background: var(--panel);
    border: .2rem solid color-mix(in srgb, var(--c) 70%, transparent); box-shadow: 0 .4rem 1.2rem #0004; min-width: 8rem; }
  .chip .dot { position: relative; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--c); display: grid; place-items: center; font-weight: 700; font-size: 1.4rem;
    box-shadow: inset 0 -.25rem 0 #0003; text-shadow: 0 .1rem 0 #0005; flex: none; }
  .chip .crown { position: absolute; top: -1.05rem; left: 50%; transform: translateX(-50%); width: 1.5rem; height: 1.15rem; }
  .chip .cName { font-weight: 600; font-size: 1.25rem; max-width: 9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .cScore { font-weight: 700; font-size: 1.5rem; margin-left: .2rem; color: var(--gold); min-width: 2rem; text-align: right; }
  .chip .cDelta { position: absolute; right: -.4rem; top: -1.3rem; font-weight: 700; font-size: 1.2rem; background: #33c46a; padding: .05rem .55rem; border-radius: 999px; animation: pop .3s; }
  .chip .cDelta.neg { background: #ff5a6e; }
  .chip.empty { --c: #ffffff44; border-style: dashed; background: #1b123888; opacity: .75; }
  .chip.empty .dot { background: #ffffff18; box-shadow: none; }
  .chip.away { opacity: .45; filter: grayscale(.7); }
  .chip.active { transform: translateY(-.5rem) scale(1.08); box-shadow: 0 0 0 .25rem var(--c), 0 0 2rem var(--c); }
  .chip.bump { animation: bump .35s; }
  @keyframes bump { 50% { transform: scale(1.15); } }
  @keyframes pop { from { transform: scale(0); } }

  /* ---------------- in-game hud ---------------- */
  #hud { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  #hudLeft { position: absolute; left: 2rem; top: 1.5rem; font-size: 1.5rem; padding: .6rem 1.2rem; border-radius: 1rem; background: var(--panel); }
  #hudLeft b { color: var(--gold); }
  #hudCenter { position: absolute; left: 50%; top: 1rem; transform: translateX(-50%); text-align: center; }
  #hudCenter .hc1 { font-size: 3.6rem; font-weight: 700; line-height: 1; }
  #hudCenter .hc2 { font-size: 1.4rem; color: #fff; opacity: .95; margin-top: .2rem; }
  #hudCenter .hc1, #hudCenter .hc2 { text-shadow: 0 .2rem 0 #1b1238, .15rem 0 0 #1b1238, -.15rem 0 0 #1b1238, 0 -.15rem 0 #1b1238, 0 .4rem 1rem #0006; }
  #hudCenter.urgent .hc1 { color: #ff6b7d; animation: throb 1s infinite; }
  @keyframes throb { 50% { transform: scale(1.12); } }
  #miniJoin { position: absolute; right: 1.6rem; top: 1.4rem; display: flex; align-items: center; gap: .8rem; padding: .6rem .9rem .6rem .6rem; border-radius: 1rem; background: var(--panel); }
  #miniQr { background: #fff; border-radius: .5rem; padding: .2rem; line-height: 0; }
  #miniQr canvas { width: 5.6rem; height: 5.6rem; image-rendering: pixelated; }
  .miniTxt { font-size: 1rem; color: var(--muted); line-height: 1.2; }
  #miniCode { font-size: 1.9rem; font-weight: 700; color: var(--gold); letter-spacing: .25rem; }

  /* ---------------- banner, popups, toasts ---------------- */
  #banner { position: absolute; left: 0; right: 0; top: 36%; text-align: center; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .35s cubic-bezier(.2, 1.6, .4, 1); }
  #banner.show { opacity: 1; transform: scale(1); }
  #banner .bBig { font-size: 6.4rem; font-weight: 700; color: var(--c); line-height: 1.05;
    text-shadow: 0 .45rem 0 #1b1238, .3rem 0 0 #1b1238, -.3rem 0 0 #1b1238, 0 -.3rem 0 #1b1238, .2rem .2rem 0 #1b1238, -.2rem .2rem 0 #1b1238, 0 1rem 2rem #0007; }
  #banner .bSmall { display: inline-block; margin-top: 1rem; font-size: 1.9rem; font-weight: 600; background: var(--panel); padding: .5rem 1.4rem; border-radius: 999px; }
  .popup { position: absolute; transform: translate(-50%, -50%); font-weight: 700; font-size: calc(2.2rem * var(--s)); color: var(--c); animation: floatUp 1.4s ease-out forwards;
    text-shadow: 0 .18rem 0 #1b1238, .13rem 0 0 #1b1238, -.13rem 0 0 #1b1238, 0 -.13rem 0 #1b1238; white-space: nowrap; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4); } 15% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }
  #toasts { position: absolute; left: 50%; top: 7.5rem; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: .5rem; }
  body.in-lobby #toasts { top: auto; bottom: 6.5rem; }
  .toast { background: var(--panel); padding: .55rem 1.3rem; border-radius: 999px; font-size: 1.35rem; color: var(--c); animation: pop .25s; transition: opacity .5s, transform .5s; }
  .toast.out { opacity: 0; transform: translateY(-1rem); }
  .confetti { position: absolute; top: -3vh; width: .8rem; height: 1.3rem; border-radius: .15rem; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

  /* ---------------- reticles ---------------- */
  #reticles { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .reticle { position: absolute; left: 0; top: 0; width: 0; height: 0; transition: opacity .2s; }
  .reticle .ring { position: absolute; left: -2rem; top: -2rem; width: 4rem; height: 4rem; border-radius: 50%; border: .45rem solid var(--c);
    box-shadow: 0 0 0 .18rem #1b1238, inset 0 0 0 .18rem #1b1238, 0 0 1.2rem var(--c); }
  .reticle .rdot { position: absolute; left: -.45rem; top: -.45rem; width: .9rem; height: .9rem; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .18rem #1b1238; }
  .reticle .rname { position: absolute; left: 0; top: 2.5rem; transform: translateX(-50%); white-space: nowrap; font-weight: 700; font-size: 1.1rem; color: #fff;
    background: var(--c); padding: .05rem .6rem; border-radius: 999px; box-shadow: 0 0 0 .15rem #1b1238; }
  .reticle.dim { opacity: .45; }
  .reticle.pulse .ring { animation: rpulse .35s ease-out; }
  @keyframes rpulse { 0% { transform: scale(.6); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* ---------------- results / pause ---------------- */
  #results, #pause { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: radial-gradient(circle at 50% 40%, #2a1c5add, #120a2bf2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6rem; }
  .resTitle, .pTitle { font-size: 5rem; font-weight: 700; text-shadow: 0 .4rem 0 #0006; }
  .podium { display: flex; align-items: flex-end; gap: 1.4rem; }
  .pod { display: flex; flex-direction: column; align-items: center; gap: .4rem; width: 15rem; }
  .pAvatar { width: 6rem; height: 6rem; border-radius: 50%; background: var(--c); display: grid; place-items: center; font-size: 3rem; font-weight: 700; box-shadow: 0 0 0 .35rem #fff, 0 0 2rem var(--c); }
  .pName { font-size: 1.8rem; font-weight: 700; }
  .pScore { font-size: 1.4rem; color: var(--gold); }
  .pStep { width: 100%; background: var(--c); border-radius: 1rem 1rem 0 0; text-align: center; font-size: 3.4rem; font-weight: 700; color: #fff; text-shadow: 0 .2rem 0 #0005;
    box-shadow: inset 0 -.8rem 0 #0002; }
  .p1 .pStep { height: 12rem; } .p2 .pStep { height: 8.5rem; } .p3 .pStep { height: 6rem; }
  .p1 .pAvatar { width: 7.5rem; height: 7.5rem; }
  .rest { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; justify-content: center; max-width: 70rem; }
  .restRow { font-size: 1.5rem; display: flex; gap: .6rem; align-items: baseline; }
  .restRow b { color: var(--c); } .restRow i { font-style: normal; color: var(--muted); }
  .resBtns { display: flex; gap: 1.4rem; }
  .resBtns.col { flex-direction: column; }
  .btn { font-size: 2rem; font-weight: 700; padding: .7rem 2.4rem; border-radius: 999px; background: #ffffff1c; text-align: center; min-width: 14rem; }
  .btn.focus { background: var(--gold); color: #2a1650; transform: scale(1.06); outline: none; }
  .resHint { color: var(--muted); font-size: 1.2rem; }

  #soundHint { position: absolute; right: 1.4rem; bottom: 4.6rem; font-size: 1rem; background: #0007; padding: .4rem .9rem; border-radius: 999px; }
  /* pointer / Magic Remote / mouse support */
  [data-act] { pointer-events: auto; cursor: pointer; }
  .modeCard:hover, #startBtn:hover, .btn:hover, .tbtn:hover { filter: brightness(1.15); }
  #roundsRow .arrow { padding: 0 .6rem; }
  #tvTools { position: absolute; right: 1.4rem; bottom: 1.4rem; display: flex; gap: .6rem; }
  .tbtn { min-width: 3rem; height: 3rem; padding: 0 .9rem; border-radius: 999px; background: var(--panel); display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem; font-weight: 600; box-shadow: 0 .3rem 1rem #0004; margin-left: .6rem; }
  .tbtn svg { width: 1.4rem; height: 1.4rem; display: block; }
  body.nocursor, body.nocursor * { cursor: none !important; }
  .compat { max-width: 64rem; text-align: center; padding: 2rem; font-size: 1.8rem; line-height: 1.4; }
  .compat b { color: var(--gold); }
  .compat small { display: block; margin-top: 1.2rem; font-size: 1rem; color: var(--muted); word-break: break-all; }
  #debug { position: absolute; left: .6rem; top: .4rem; font: 1rem monospace; color: #fff; background: #0008; padding: .2rem .5rem; }
  #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #5b3cc4, #1b1238); transition: opacity .6s; z-index: 5; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .logo { position: static; transform: rotate(-4deg); animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: rotate(-2deg) translateY(-1rem); } }
  .bootErr { font-size: 2rem; text-align: center; max-width: 60rem; }
  .bootErr small { color: var(--muted); font-size: 1.2rem; }
</style>
</head>
<body class="in-lobby">
  <canvas id="gl"></canvas>
  <div id="ui">
    <div id="reticles"></div>
    <div id="popups"></div>
    <section id="lobby">
      <div class="logo">TOPPLE<span>PARTY</span></div>
      <div class="joinCard panel">
        <div class="scan">Scan to join!</div>
        <div id="qr"></div>
        <div class="joinText">no camera? go to<br /><span id="joinUrl">…</span><br />and enter code<div id="roomCode">····</div></div>
      </div>
      <div class="modePanel panel">
        <div class="panelTitle">Game mode</div>
        <div id="modes"></div>
        <div id="roundsRow"></div>
        <div id="startBtn" data-act="start">START</div>
        <div id="hostHint"></div>
      </div>
      <div id="netStatus" data-kind="busy">Starting…</div>
    </section>
    <section id="hud" class="hidden">
      <div id="hudLeft"></div>
      <div id="hudCenter"></div>
      <div id="miniJoin" class="hidden"><div id="miniQr"></div><div class="miniTxt">Join in!<div id="miniCode"></div></div></div>
    </section>
    <div id="players"></div>
    <div id="banner"></div>
    <section id="results" class="hidden"></section>
    <section id="pause" class="hidden"></section>
    <div id="toasts"></div>
    <div id="soundHint">Press OK (or click) for sound</div>
    <div id="tvTools"><div class="tbtn" data-act="pause" id="pauseTool" title="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></div><div class="tbtn" data-act="sound" id="soundTool" title="Sound"></div><div class="tbtn" data-act="fullscreen" id="fsTool"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>&nbsp;Full screen</div></div>
    <div id="debug" class="hidden"></div>
  </div>
  <div id="boot"><div class="logo">TOPPLE<span>PARTY</span></div></div>
  <script>
    // Runs before the game (plain ES5) so older smart-TV browsers get an explanation instead of a blank screen.
    (function () {
      var missing = [];
      if (typeof WebAssembly !== 'object') missing.push('WebAssembly');
      try {
        var gl = document.createElement('canvas').getContext('webgl2');
        if (!gl) missing.push('WebGL 2');
        else if (gl.getExtension('WEBGL_lose_context')) gl.getExtension('WEBGL_lose_context').loseContext();
      } catch (e) { missing.push('WebGL 2'); }
      window.__compatMissing = missing;
      function show(msg) {
        var b = document.getElementById('boot');
        if (!b) return;
        b.className = '';
        b.innerHTML = '<div class="compat">' + msg + '<small>' + navigator.userAgent.replace(/</g, '') + '</small></div>';
      }
      window.__compatShow = show;
      if (missing.length) {
        show('This browser can\u2019t run Topple Party. It\u2019s missing <b>' + missing.join('</b> and <b>') + '</b>.<br>Try the Android TV app, a newer TV, or a laptop/streaming stick connected to the TV.');
        window.__compatFail = true;
      }
      setTimeout(function () {
        if (!window.__booted && !window.__compatFail) show('The game didn\u2019t start. This browser is probably too old (it needs a Chrome 75-level browser with WebGL 2).');
      }, 20000);
    })();
  </script>
  <script nomodule>window.__compatShow && window.__compatShow('This browser is too old for Topple Party (no JavaScript module support).');</script>
  <script type="module" src="/src/tv/main.ts"></script>
</body>
</html>
